<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Timeline | MAGNUM-2K26</title>
  <meta name="description"
    content="Explore the complete interactive 3D timeline and schedule of Hackfest'26. Key dates, milestones, registration deadlines and more." />
  <meta name="author" content="Finite Loop Club" />

  <!-- OG -->
  <meta property="og:title" content="Timeline | Hackfest '26" />
  <meta property="og:description" content="Explore the complete schedule and interactive 3D timeline of Hackfest'26." />
  <meta property="og:url" content="https://hackfest.dev/timeline" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/assets/images/logos/hflogowithbg.webp" />

  <!-- Favicons -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon-96x96.png" type="image/png" sizes="96x96" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/assets/css/style.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #020617;
    }

    #root {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      z-index: 0;
    }

    /* ── View Toggle Buttons in Navbar ── */
    #view-toggle-wrap {
      display: none;          /* hidden on mobile */
      align-items: center;
      gap: 3px;
      background: rgba(2,6,23,0.75);
      border: 1px solid rgba(250,204,21,0.35);
      border-radius: 999px;
      padding: 3px;
      backdrop-filter: blur(12px);
      box-shadow: 0 2px 12px rgba(0,0,0,0.4), 0 0 8px rgba(250,204,21,0.1);
      flex-shrink: 0;
    }
    @media (min-width: 768px) {
      #view-toggle-wrap {
        display: inline-flex; /* show on tablet/desktop */
      }
    }
    .view-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 13px;
      border-radius: 999px;
      border: none;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.04em;
      font-family: 'Inter','Segoe UI',sans-serif;
      transition: all 0.22s ease;
      user-select: none;
      background: transparent;
      color: #94a3b8;
    }
    .view-btn.active {
      background: linear-gradient(135deg, #fef08a 0%, #eab308 100%);
      color: #020617;
      box-shadow: 0 2px 10px rgba(250,204,21,0.4);
    }
    .view-btn:hover:not(.active) {
      color: #e2e8f0;
    }
  </style>
</head>

<body>

  <!-- ── COMPASS BUTTON ──────────────────────────────────── -->
  <a id="compass-btn" href="/login" aria-label="Open Compass">
    <div class="compass-inner">
      <svg class="compass-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z" />
        <circle cx="12" cy="12" r="10" />
      </svg>
      <span class="compass-label fp">Compass</span>
    </div>
  </a>

  <!-- ── NAVBAR ──────────────────────────────────────────── -->
  <div id="navbar">
    <div id="navbar-bg"></div>
    <div id="navbar-border-outer"></div>
    <div id="navbar-border-dashed"></div>
    <div id="navbar-inner">
      <a class="nav-logo" href="/">
        <img src="/assets/images/logos/logo-glow.png" alt="Hackfest Logo" />
      </a>
      <nav id="nav-links" aria-label="Main navigation">
        <a class="nav-link" href="/">Home</a>
        <a class="nav-link" href="/about">About</a>
        <a class="nav-link" href="/events">Events</a>
        <a class="nav-link active" href="/timeline">Timeline</a>
        <a class="nav-link" href="/contact">Contact</a>
      </nav>
      <div id="view-toggle-wrap">
        <button id="btn-3d" class="view-btn active" onclick="setTimelineView('3d')" aria-pressed="true">⛵ 3D</button>
        <button id="btn-2d" class="view-btn" onclick="setTimelineView('2d')" aria-pressed="false">📋 2D</button>
      </div>
      <button id="nav-hamburger" aria-label="Toggle menu" aria-expanded="false">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
    </div>
    <div id="mobile-menu" role="navigation" aria-label="Mobile navigation">
      <a class="mobile-nav-link" href="/">Home</a>
      <a class="mobile-nav-link" href="/about">About</a>
      <a class="mobile-nav-link" href="/events">Events</a>
      <a class="mobile-nav-link active" href="/timeline">Timeline</a>
      <a class="mobile-nav-link" href="/contact">Contact</a>
      <!-- View toggle inside mobile menu -->
      <div id="view-toggle-mobile" style="display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(34,211,238,0.15);">
        <button id="btn-3d-mob" class="view-btn active" onclick="setTimelineView('3d')" style="flex:1;justify-content:center;">⛵ 3D View</button>
        <button id="btn-2d-mob" class="view-btn" onclick="setTimelineView('2d')" style="flex:1;justify-content:center;">📋 2D View</button>
      </div>
    </div>
  </div>

  <!-- ── 3D TIMELINE ROOT ─────────────────────────────────── -->
  <div id="root"></div>

  <!-- ── SCRIPTS ──────────────────────────────────────────── -->
  <script type="module" src="/src/main.jsx"></script>
  <script src="/assets/js/main.js"></script>

  <script>
    // ── Bridge: HTML navbar ↔ React view state ──────────────
    function setTimelineView(v) {
      // Desktop buttons
      document.getElementById('btn-3d').classList.toggle('active', v === '3d');
      document.getElementById('btn-2d').classList.toggle('active', v === '2d');
      document.getElementById('btn-3d').setAttribute('aria-pressed', v === '3d');
      document.getElementById('btn-2d').setAttribute('aria-pressed', v === '2d');
      // Mobile buttons
      document.getElementById('btn-3d-mob').classList.toggle('active', v === '3d');
      document.getElementById('btn-2d-mob').classList.toggle('active', v === '2d');
      window.dispatchEvent(new CustomEvent('timeline:setView', { detail: v }));
    }
    // Keep button state in sync when React changes the view internally
    window.addEventListener('timeline:viewChanged', function(e) {
      document.getElementById('btn-3d').classList.toggle('active', e.detail === '3d');
      document.getElementById('btn-2d').classList.toggle('active', e.detail === '2d');
      document.getElementById('btn-3d-mob').classList.toggle('active', e.detail === '3d');
      document.getElementById('btn-2d-mob').classList.toggle('active', e.detail === '2d');
    });
  </script>
</body>

</html>
