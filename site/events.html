<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Side Quests &amp; Events | MAGNUM-2K26</title>
  <meta name="description" content="Explore Hackfest'26 Side Quests — CTF challenges, treasure hunt and tech banter. Exciting additional events at NMAMIT, Nitte (April 17-19)." />
  <meta name="author" content="Finite Loop Club" />
  <meta property="og:title" content="Hackfest '26 Side Quests | CTF, Treasure Hunt &amp; Tech Banter" />
  <meta property="og:description" content="Explore Hackfest'26 Side Quests — CTF challenges, treasure hunt and tech banter." />
  <meta property="og:url" content="https://hackfest.dev/events" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/images/logos/hflogowithbg.webp" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" href="favicon-96x96.png" type="image/png" sizes="96x96" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .events-bg { position:fixed;inset:0;background:url('assets/images/backgrounds/shipwreck.jpeg') no-repeat center center/cover;z-index:-1;filter:brightness(0.4); }
    .events-carousel-outer { position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;padding-top:80px;box-sizing:border-box; perspective:1000px; }
    
    .events-track { display:flex;width:100%;height:100%; position:relative; transform-style:preserve-3d; justify-content:center; align-items:center; cursor:grab; }
    .events-track:active { cursor:grabbing; }
    
    .event-slide { 
      position:absolute; width:100%; height:100%; 
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      transition:transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.6s ease;
      opacity:0; pointer-events:none; z-index:0; user-select:none;
    }
    
    .circle-wrapper { position:relative;display:inline-flex;align-items:center;justify-content:center; max-width:92vw; max-height:80vh; }
    
    .event-circle { 
      width:360px; height:360px; border-radius:50%; overflow:hidden; 
      box-shadow: 0 0 30px rgba(0,0,0,0.6); 
      position:relative; cursor:pointer; transition:transform 0.4s ease-in-out; 
    }
    .event-circle img { width:100%;height:100%;object-fit:cover;display:block;pointer-events:none; }
    
    /* Hover only scales up if it is not shrunken */
    .event-slide[style*="translateZ(0px)"] .event-circle:hover:not([style*="scale"]) { transform:scale(1.04); }
    
    .thunder-canvas { position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:10; max-width:100vw; }
    
    /* Steering Wheel */
    .steering-wheel-container { position:fixed;bottom:-80px;left:50%;transform:translateX(-50%);width:220px;height:220px;z-index:100;opacity:0.6;cursor:grab; border-radius: 50%; touch-action: none; transition: opacity 0.3s, transform 0.4s; }
    .steering-wheel-container:hover { opacity: 1; }
    .steering-wheel-container:active { cursor:grabbing; opacity: 1; }
    .steering-wheel-container.hidden { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(100px); }
    .steering-wheel { width:100%;height:100%;object-fit:contain;pointer-events:none; filter: drop-shadow(0 0 10px rgba(0,0,0,0.8)); }
    
    @media(max-width:600px){ 
      .event-circle{width:240px;height:240px} 
      .steering-wheel-container{width:150px;height:150px;bottom:-55px;}
    }

    @media(max-width:360px){
      .event-circle{width:200px;height:200px}
      .steering-wheel-container{width:120px;height:120px;bottom:-40px;}
    }

    @media(max-height:600px){
      .event-circle{width:200px;height:200px}
      .steering-wheel-container{width:120px;height:120px;bottom:-45px;}
    }
  </style>
</head>
<body>
  <div class="events-bg"></div>
  <div id="loader">
    <div style="position:absolute;inset:0;background:radial-gradient(circle at center,#1c1917,#0a0a0a 60%,#000);opacity:0.8;"></div>
    <div id="loader-inner"><img id="loader-logo" src="assets/images/logos/logo-text.png" alt="MAGNUM Logo" width="600" height="200" /></div>
    <div id="loader-bottom-right">
      <div id="loader-progress-wrap"><span id="loader-progress" class="fc">0%</span><br /><span id="loader-label">Loading Assets</span></div>
      <img id="loader-steering" src="assets/images/backgrounds/steering.png" alt="Loading..." />
    </div>
  </div>
  <a id="compass-btn" href="/login" aria-label="Open Compass">
    <div class="compass-inner">
      <svg class="compass-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z" />
        <circle cx="12" cy="12" r="10" />
      </svg>
      <span class="compass-label fp">Compass</span>
    </div>
  </a>
  <div id="navbar">
    <div id="navbar-bg"></div>
    <div id="navbar-border-outer"></div>
    <div id="navbar-border-dashed"></div>
    <div id="navbar-inner">
      <a class="nav-logo" href="/"><img src="/assets/images/logos/logo-glow.png" alt="Hackfest Logo" /></a>
      <nav id="nav-links" aria-label="Main navigation">
        <a class="nav-link" href="/">Home</a>
        <a class="nav-link" href="/about">About</a>
        <a class="nav-link active" href="/events">Events</a>
        <a class="nav-link" href="/timeline">Timeline</a>
        <a class="nav-link" href="/contact">Contact</a>
      </nav>
      <div class="nav-cta">
        <a href="/login"><button class="nav-btn" type="button"><div class="nav-btn-bg"></div><span>Event Login</span></button></a>
      </div>
      <button id="nav-hamburger" aria-label="Toggle menu" aria-expanded="false">
        <span class="hamburger-line"></span><span class="hamburger-line"></span><span class="hamburger-line"></span>
      </button>
    </div>
    <div id="mobile-menu" role="navigation" aria-label="Mobile navigation">
      <a class="mobile-nav-link" href="/">Home</a>
      <a class="mobile-nav-link" href="/about">About</a>
      <a class="mobile-nav-link active" href="/events">Events</a>
      <a class="mobile-nav-link" href="/timeline">Timeline</a>
      <a class="mobile-nav-link" href="/contact">Contact</a>
      <a class="mobile-nav-link" href="/login">Event Login</a>
    </div>
  </div>

  <main class="page-main" style="padding:0;overflow:hidden;">
    <div class="events-carousel-outer">
      <div class="events-track" id="events-track">
        <div class="event-slide" id="slide-0"><div class="circle-wrapper" id="cw-0"><canvas class="thunder-canvas" id="tc-0"></canvas><div class="event-circle" id="ec-0"><img src="assets/images/Events/CodeVoyage.png" alt="CodeVoyage" /></div></div></div>
        <div class="event-slide" id="slide-1"><div class="circle-wrapper" id="cw-1"><canvas class="thunder-canvas" id="tc-1"></canvas><div class="event-circle" id="ec-1"><img src="assets/images/Events/communication.jpg" alt="Communication Event" /></div></div></div>
        <div class="event-slide" id="slide-2"><div class="circle-wrapper" id="cw-2"><canvas class="thunder-canvas" id="tc-2"></canvas><div class="event-circle" id="ec-2"><img src="assets/images/Events/content creation.png" alt="Content Creation Event" /></div></div></div>
        <div class="event-slide" id="slide-3"><div class="circle-wrapper" id="cw-3"><canvas class="thunder-canvas" id="tc-3"></canvas><div class="event-circle" id="ec-3"><img src="assets/images/Events/Black Pearl (Cyber Security).jpeg" alt="Black Pearl (Cyber Security)" /></div></div></div>
        <div class="event-slide" id="slide-4"><div class="circle-wrapper" id="cw-4"><canvas class="thunder-canvas" id="tc-4"></canvas><div class="event-circle" id="ec-4"><img src="assets/images/Events/Data Chronicles.jpg" alt="Data Chronicles" /></div></div></div>
        <div class="event-slide" id="slide-5"><div class="circle-wrapper" id="cw-5"><canvas class="thunder-canvas" id="tc-5"></canvas><div class="event-circle" id="ec-5"><img src="assets/images/Events/Captain's Canvas (Designing).png" alt="Captain's Canvas (Designing)" /></div></div></div>
        <div class="event-slide" id="slide-6"><div class="circle-wrapper" id="cw-6"><canvas class="thunder-canvas" id="tc-6"></canvas><div class="event-circle" id="ec-6"><img src="assets/images/Events/Pirates of Arena (Gaming).png" alt="Pirates of Arena (Gaming)" /></div></div></div>
        <div class="event-slide" id="slide-7"><div class="circle-wrapper" id="cw-7"><canvas class="thunder-canvas" id="tc-7"></canvas><div class="event-circle" id="ec-7"><img src="assets/images/Events/Voyage Of Wisdom.png" alt="Voyage Of Wisdom" /></div></div></div>
        <div class="event-slide" id="slide-8"><div class="circle-wrapper" id="cw-8"><canvas class="thunder-canvas" id="tc-8"></canvas><div class="event-circle" id="ec-8"><img src="assets/images/Events/Prompt Mariners.jpg" alt="Prompt Mariners" /></div></div></div>
        <div class="event-slide" id="slide-9"><div class="circle-wrapper" id="cw-9"><canvas class="thunder-canvas" id="tc-9"></canvas><div class="event-circle" id="ec-9"><img src="assets/images/Events/RHYTHM RAIDERS.png" alt="Rhythm Raiders" /></div></div></div>
      </div>
    </div>
  </main>

  <div class="steering-wheel-container" id="steering-wheel-container">
    <img src="assets/images/backgrounds/steering.png" alt="Steering Wheel" class="steering-wheel" id="steering-wheel" />
  </div>

  <script src="assets/js/events-carousel.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
